  <text x="120" y="255" font-family="Arial" font-size="15" fill="#1f3a34" text-anchor="middle">Guaranteed</text>

  <path d="M463 115 L618 210" stroke="#5a6b73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M652 312 L608 353" stroke="#5a6b73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M508 420 L292 420" stroke="#5a6b73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M192 353 L148 312" stroke="#5a6b73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M155 182 L340 118" stroke="#5a6b73" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="400" y="530" font-family="Arial" font-size="15" fill="#666" text-anchor="middle">The cycle repeats — speculation stays out, participation stays in</text>
